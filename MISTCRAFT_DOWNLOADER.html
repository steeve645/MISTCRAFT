<html>
  <head>
    <title>MISTCRAFT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      body {
        margin:0;
        min-height: 100vh;
        background: url("Minecraft2.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-color: black;
        z-index: -100;
      }
      h1 {
        font-size: 35px;
      }
      .tete {
        position: absolute;
        margin:10px;
        backdrop-filter: blur(30px);
        width: 70%;
        text-align: center;
        top: 20%;
        left: 50%;
        transform: translate(-50%,-50%);
        border-radius: 50px;
        animation: apparait 1s linear 1
      }
      .tete,h1 {
        color: white
      }
      .corps {
        display: flex;
        flex-direction: grid;
        position: absolute;
        top: 70%;
        left: 50%;
        transform: translate(-50%,-50%);
        gap: 20px;
        padding: 10px;
        border-radius:30px;
        backdrop-filter: blur(15px)
      }
      .corps button {
        padding: 10px;
        background:#186d00;
        border:4px solid #614300;
        border-radius:0px;
        height: 70px;
        width: 140px;
        filter: drop-shadow(0 8px 0 blue);
        color:white;
        font-size: 18px;
        animation: flotte 1s ease-in-out 1;
        clip-path: polygon(
          10% 0,10% 10%,
          5% 10%,5% 20%,
          0% 20%,0% 80%,
          5% 80%,5% 90%,
          10% 90%,10% 100%,
          10% 100%,90% 100%,
          90% 90%,95% 90%,
          95% 80%,100% 80%,
          100% 20%,95% 20%,
          95% 10%,90% 10%,
          90% 0
        )
      }
      .corps a {
        text-decoration: none;
        color:white;
      }
      .retour {
        position:absolute;
        text-decoration: none;
        background:red;
        border-radius: 30px;
        padding: 5px;
        left:5%;
        top: 2%;
        color: white;
      }
      .retour a {
        text-decoration: none;
        color: white
      }
      .sub {
        position:absolute;
        text-decoration: none;
        background:red;
        border-radius: 30px;
        padding: 5px;
        left:25%;
        top: 2%;
        color: white;
      }
      .sub button {
        text-decoration: none;
        color: white;
        background:none;
        border: none;
      }
      @keyframes flotte {
        0%{opacity:0;transform:translateY(20px)};
        100%{opacity:100%;transform:translateY(-50px)};
      }
      @keyframes apparait {
        0%{opacity: 0%;color: green};
        100%{opacity: 100%;color:white}
      }
    </style>
  </head>
  <body>
    <div class="tete">
      <h1>MISTCRAFT</h1>
      <small>telecharger les fichier ici</small>
    </div>
    <div class="corps">
      <button id="enterbtn"><a href="MISTCRAFT.html" download>Telecharger le pdf</a></button>
      <button id="exitbtn"><a href="Minecraft1.png" download>Telecharger l'image</a></button>
    </div>
    <div class="retour"><a href="MISTCRAFT.html">Retour</a>
    </div>
    <div class="sub"><button onclick="sub()">s'abonner</>
    </div>
    <script>
      function sub() {
        alert("Merci de t'abonner")
        window.location.href="https://www.facebook.com/jonathan.653927"
      }
    </script>
  </body>
</html>
