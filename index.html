<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MISTCRAFT</title>
    <style>
      body {
        margin:0;
        min-height: 100vh;
        background: url("Minecraft1.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-color: black;
        z-index: -100;
      }
      h1 {
        font-size: 35px;
      }
      .tete {
        position: absolute;
        margin:10px;
        backdrop-filter: blur(30px);
        width: 70%;
        text-align: center;
        top: 20%;
        left: 50%;
        transform: translate(-50%,-50%);
        border-radius: 50px
      }
      .tete,h1 {
        color: white
      }
      .corps {
        display: flex;
        flex-direction: grid;
        position: absolute;
        top: 70%;
        left: 50%;
        transform: translate(-50%,-50%);
        gap: 20px;
      }
      .corps button {
        padding: 10px;
        background:#186d00;
        border:4px solid #614300;
        border-radius:0px;
        height: 70px;
        width: 140px;
        box-shadow: 10px 15px 10px #000000a0;
        color:white;
        font-size: 28px;
        animation: flotte 1s ease-in-out 1
      }
      .corps a {
        text-decoration: none;
        color:white;
      }
      @keyframes flotte {
        0%{transform:translateY(20px)};
        100%{transform:translateY(-50px)};
      }
    </style>
  </head>
  <body>
    <div class="tete">
      <h1>MISTCRAFT</h1>
    </div>
    <div class="corps">
      <button id="enterbtn"><a href="MISTCRAFT_DOWNLOADER.html">Entrer</a></button>
      <button id="exitbtn"><a href="">Sortir</a></button>
    </div>
  </body>
</html>
