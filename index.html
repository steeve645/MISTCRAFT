<html>
  <head>
    <title>MISTCRAFT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      body {
        margin:0;
        min-height: 100vh;
        background: url("Minecraft1.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-color: black;
        z-index: -100;
      }
      h1 {
        font-size: 35px;
      }
      .tete {
        position: absolute;
        margin:10px;
        backdrop-filter: blur(30px);
        width: 70%;
        text-align: center;
        top: 20%;
        left: 50%;
        transform: translate(-50%,-50%);
        border-radius: 50px;
        animation: apparait 0.8s linear 1
      }
      .tete,h1 {
        color: white;
        animation: apparait 0.8s linear 1
      }
      .corps {
        display: flex;
        flex-direction: grid;
        position: absolute;
        top: 70%;
        left: 50%;
        transform: translate(-50%,-50%);
        gap: 20px;
        backdrop-filter:blur(10px);
        padding: 10px;
        background-color: #ff80240e;
        border-radius:20px;
        animation:apparait 2s ease-in-out 1
      }
      .corps button {
        padding: 10px;
        background:#186d00;
        border:4px solid #614300;
        height: 70px;
        width: 140px;
        filter: drop-shadow( 5px 5px 5px blue);
        color:white;
        font-size: 28px;
        animation: flotte 2s linear 1;
        clip-path: polygon(
          10% 0,10% 10%,
          5% 10%,5% 20%,
          0% 20%,0% 80%,
          5% 80%,5% 90%,
          10% 90%,10% 100%,
          10% 100%,90% 100%,
          90% 90%,95% 90%,
          95% 80%,100% 80%,
          100% 20%,95% 20%,
          95% 10%,90% 10%,
          90% 0
        )
        
      }
      .corps button:hover{
        background:hwb(109 0% 70%)
      }
      .corps a {
        text-decoration: none;
        color:white;
      }
      @keyframes flotte {
        0%{opacity:0;transform:translateY(20px)};
        100%{opacty:100%;transform:translateY(-50px)};
      }
      @keyframes apparait {
        0%{opacity: 0%;color: green};
        100%{opacity: 100%;color:white}
      }
    </style>
  </head>
  <body>
    <div class="tete">
      <h1>MISTCRAFT</h1>
      <small>abonnez-vous</small>
    </div>
    <div class="corps">
      <button id="enterbtn" onclick="gotodownload()">Entrer</button>
      <button id="exitbtn" onclick="goout()">Sortir</button>
    </div>
    <script>
      function gotodownload() {
        setTimeout(gotodownloader,1000)
      }
      function gotodownloader() {
        window.location.href="MISTCRAFT_DOWNLOADER.html"
      }
      function goout() {
        alert("Merci d'avoir visté MISTCRAFT")
        window.location.href="https://google.com"
      }
    </script>
  </body>
</html>
